# Eclipse Mosquitto 2.0.22 — Configuracao local Cidade Viva (Entrega B)
# Publicado no host exclusivamente em loopback (127.0.0.1) via Docker Compose.

per_listener_settings false
listener 1883 0.0.0.0

# Seguranca obrigatoria: sem acesso anonimo, autenticacao por arquivo de senhas e ACL por topico
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/config/acl.conf

# Persistencia local em volume Docker
persistence true
persistence_location /mosquitto/data/

# Logs estruturados em stdout e arquivo local
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%SZ
