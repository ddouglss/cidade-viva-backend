# =============================================================================
# Cidade Viva — Controle de Acesso (ACL) MQTT v1
# Referencia normativa: docs/shared/02-CONTRATOS-MQTT-V1.md
# =============================================================================

# Servico Backend (.NET API): consome telemetria/status/ack e publica comandos
user cv_backend
topic read cidade-viva/v1/+/telemetry
topic read cidade-viva/v1/+/status
topic read cidade-viva/v1/+/ack
topic write cidade-viva/v1/+/commands

# Simulador / Dispositivos de laboratorio (esp32-energy e esp32-water)
user cv_simulator
topic write cidade-viva/v1/esp32-energy/telemetry
topic write cidade-viva/v1/esp32-energy/status
topic write cidade-viva/v1/esp32-energy/ack
topic read cidade-viva/v1/esp32-energy/commands
topic write cidade-viva/v1/esp32-water/telemetry
topic write cidade-viva/v1/esp32-water/status
topic write cidade-viva/v1/esp32-water/ack
topic read cidade-viva/v1/esp32-water/commands
